services:
  - type: web
    name: qmx-qamar-ai
    runtime: python
    plan: free
    buildCommand: apt-get update && apt-get install -y tesseract-ocr tesseract-ocr-ara poppler-utils && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
